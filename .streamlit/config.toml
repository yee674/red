# Streamlit 主题：深色模式的底色已从近黑调亮，保留红金质感
[theme]
base = "dark"
primaryColor = "#e0a35a" #主色（金），按钮、进度条、滑块、链接高亮都用它
backgroundColor = "#261214" #主背景（暗红棕）
secondaryBackgroundColor = "#35201f" #次级背景，侧边栏、卡片、代码块的底
textColor = "#f8f1ec"   #正文文字（米白）

#关闭 Streamlit 官方的匿名使用统计上报。不联网、不传数据，隐私上也更干净
[browser]
gatherUsageStats = false

[server]
# 保存 .py 文件后自动重跑（kg.json / materials / assets 的自动刷新由 app.py 自己监听）
runOnSave = true

